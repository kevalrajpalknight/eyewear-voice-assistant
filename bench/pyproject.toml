[project]
name = "aiglasses-bench"
version = "0.1.0"
description = "STT and TTS benchmark for the aiglasses voice assistant. Separate from the BLE stack on purpose."
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
    "psutil==7.2.2",
    "jiwer==4.0.0",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.3",
    "moonshine-voice==0.1.5",
    "kokoro-onnx==0.6.1",
    "onnxruntime==1.31.0",
    "tokenizers==0.23.3",
    "huggingface-hub==2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # measurement scripts keep wide result dicts

[tool.uv]
exclude-newer = "2026-10-17T00:00:00Z"
