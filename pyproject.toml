[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiglasses"
version = "0.1.0"
description = "Core library and CLI for AIMB-G2 AI glasses (personal interoperability)"
requires-python = ">=3.10"
dependencies = [
    "bleak>=3.0",
    "numpy>=2.0",
    "pydantic-settings[toml]>=2.6",
    "pyyaml>=6.0",
    "rich>=14.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "typer>=0.15",
    "tzdata==2026.4",
]

[project.scripts]
aiglasses = "aiglasses.cli.main:app"

[project.optional-dependencies]
research = [
    "av>=17.1.0",
]
assistant = [
    "moonshine-voice==0.1.5",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.3",
    "rapidfuzz==3.14.6; python_version >= '3.11'",
    "jellyfish==1.2.1",
    "sherpa-onnx==1.13.8; python_version >= '3.11'",
    "sherpa-onnx-core==1.13.8; python_version >= '3.11'",
    "kokoro-onnx==0.6.1; python_version >= '3.11'",
    "onnxruntime==1.31.0; python_version >= '3.11'",
]

llm = [
    "langchain-core==1.6.12",
    "langchain-openai==1.7.2",
    "langchain-anthropic==1.7.5",
    "langchain-google-genai==4.4.2",
    "psutil==7.2.2",
    "httpx==0.28.1",
    "pillow==12.3.0",
]

search = [
    "ddgs==9.16.0",
]

[dependency-groups]
dev = [
    "av>=17.1.0",
    "mypy>=1.13",
    "nox>=2024.10",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiglasses"]

[tool.ruff]
extend-exclude = ["bench"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/test_bugreport.py" = ["E501"]  # long log lines in the synthetic fixture

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["winrt.*", "psutil", "sounddevice", "soundfile", "moonshine_voice", "moonshine_voice.*", "faster_whisper", "kokoro_onnx", "sherpa_onnx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=aiglasses --cov-report=term-missing"

[tool.uv]
# New transitive packages of the `assistant` extra are held to releases at least 14 days old
# (2026-10-17 or earlier). Existing locked packages, including the BLE stack, are left alone.
constraint-dependencies = [
    "xxhash<=4.0.1",
    "websockets<=17.2",
    "uuid-utils<=0.17.1",
    "pyasn1<=0.6.4",
    "opentelemetry-api<=1.45.1",
    "openai<=3.32.0",
    "langsmith<=0.14.11",
    "langchain-protocol<=0.0.19",
    "jsonpointer<=3.2.1",
    "jsonpatch<=1.35",
    "jiter<=0.17.0",
    "google-genai<=2.31.0",
    "anthropic<=1.15.0",
    "huggingface-hub<=2.2.0",
    "hf-xet<=1.7.0",
    "httpx2<=2.13.1",
    "httpcore2<=2.13.1",
    "certifi<=2026.7.22",
]
