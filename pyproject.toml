[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiglasses"
version = "0.1.0"
description = "Core library and CLI for AIMB-G2 AI glasses (personal interoperability)"
requires-python = ">=3.10"
dependencies = [
    "bleak>=3.0",
    "numpy>=2.0",
    "pydantic-settings[toml]>=2.6",
    "pyyaml>=6.0",
    "rich>=14.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "typer>=0.15",
]

[project.scripts]
aiglasses = "aiglasses.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "nox>=2024.10",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiglasses"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["common.py", "enumerate.py", "listen.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["UP042"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=aiglasses --cov-report=term-missing"
