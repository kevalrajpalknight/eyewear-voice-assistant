[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiglasses"
version = "0.1.0"
description = "Core library and CLI for AIMB-G2 AI glasses (personal interoperability)"
requires-python = ">=3.10"
dependencies = [
    "bleak>=3.0",
    "numpy>=2.0",
    "pydantic-settings[toml]>=2.6",
    "pyyaml>=6.0",
    "rich>=14.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "typer>=0.15",
]

[project.scripts]
aiglasses = "aiglasses.cli.main:app"

[project.optional-dependencies]
research = [
    "av>=17.1.0",
]

[dependency-groups]
dev = [
    "av>=17.1.0",
    "mypy>=1.13",
    "nox>=2024.10",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiglasses"]

[tool.ruff]
extend-exclude = ["bench"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/test_bugreport.py" = ["E501"]  # long log lines in the synthetic fixture

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sounddevice", "soundfile", "moonshine_voice", "moonshine_voice.*", "faster_whisper", "kokoro_onnx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=aiglasses --cov-report=term-missing"
