repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-secrets
        name: block .env files and API-key-looking strings
        entry: python scripts/check_secrets.py
        language: system
        exclude: ^(uv\.lock|bench/uv\.lock|tests/test_secrets_guard\.py)$
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest (quick)
        entry: uv run pytest -q -x --no-cov
        language: system
        pass_filenames: false
        types: [python]
