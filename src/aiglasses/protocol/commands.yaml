# Entries from observed captures of the official app are CONFIRMED and need a capture source.
# Entries read from the app's code are INFERRED and are never sendable (safe_to_send false) until
# confirmed on the device and approved. Fields: name, characteristic (UUID), bytes (full frame, hex),
# direction (write|notify), status (CONFIRMED|INFERRED), source, safe_to_send (bool).
# Frame: BC | cmd | len16 LE | crc16-MODBUS LE of payload | payload (empty payload: crc FFFF).
