# Deterministic device and memory commands (lane 0). Data, not code: edit freely.
# A request matches when ANY `match` pattern fits the lower-cased words AND no `reject` pattern does.
# `reject` exists for near misses such as "I took a photo yesterday".
intents:
  take_photo:
    tool: take_photo
    match:
      - '^(?:please |can you |could you |go ahead and |hey )*(?:take|snap|capture|shoot|click|grab|get) (?:a |an |one |another |me a |the |my )?(?:new )?(?:photo|picture|pic|photograph|image|snap|shot)s?\b'
      - '^(?:please )?(?:photo|picture|image) (?:now|please)\b'
      - '^(?:please |can you |could you )*(?:take|click) (?:a )?(?:photo|picture|pic) of (?:this|that|it|me)$'
      - '^(?:please |can you |could you )*(?:snap|capture|click|shoot)(?: it| this| that| one| now| a photo| a picture)?$'
      - '^(?:please |can you |could you )*(?:snap|click|shoot) (?:a |one |another )?(?:photo|picture|pic)\b'
    reject:
      - '\b(?:took|taken|taking|have|had|did|yesterday|last|earlier|ago|how|when|why|what|where)\b'
      - '\b(?:don''t|do not|never|stop|not)\b'
  open_camera:
    tool: take_photo
    args: {intro: true}
    match:
      - '^(?:please |can you |could you |go ahead and )*(?:open|start|turn on|switch on|activate|launch|fire up|use)(?: up)? (?:the |my )?(?:glasses )?camera(?: app)?\b'
      - '^(?:the )?camera(?: on| please| now)?$'
    reject:
      - '\b(?:don''t|do not|never|how|why|when|what|where|did|does|is|was)\b'
  read_battery:
    tool: read_battery
    match:
      - '\b(?:battery|charge)\b.*\b(?:level|left|percent|percentage|status)\b'
      - '\bhow much (?:battery|charge)\b'
      - '\bbattery\b'
    reject:
      - '\b(?:phone|laptop|remote|car)\b'
  read_media_counts:
    tool: read_media_counts
    match:
      - '\bhow many (?:photos|pictures|videos|recordings)\b'
    reject:
      - '\b(?:phone|laptop|gallery on)\b'
  forget_last:
    tool: forget_all_that
    args: {scope: last_exchange}
    match:
      - '^(?:please )?forget (?:that|this|what i (?:just )?said)\b'
      - '^(?:please )?ignore (?:that|what i (?:just )?said)\b'
      - '^(?:please )?(?:scratch|disregard) that\b'
  forget_everything:
    tool: forget_all_that
    args: {scope: everything}
    match:
      - '\b(?:clear|wipe|reset) (?:your |my )?memory\b'
      - '^(?:please )?let''?s start over\b'
      - '^(?:please )?(?:forget everything|start over|start again)\b'
  describe_scene:
    tool: describe_scene
    match:
      - '\bwhat (?:am i|are we) (?:looking|looking at)\b'
      - '\bwhat do you see\b'
      - '^(?:please |can you |could you )*(?:identify|recognise|recognize|name)(?: this| that| the)?(?: object| thing| item| animal| plant| flower| fruit| product)?$'
      - '^(?:what is|what''s|what are) (?:this|that|these|those|in front of me)(?: object| thing| item)?$'
      - '^(?:please |can you |could you )*(?:look at|check out) (?:this|that)$'
      - '^(?:please )?(?:look at|describe) (?:this|what i(?:''m| am) looking at)\b'
    allow:
      - '\b(?:identify|identifying|recogni[sz]e|recogni[sz]ing|scan|describe|inspect)\b'
      - '\bwhat (?:is|are|was|were|s) (?:this|that|these|those|it|in front of me)\b'
      - '\b(?:look|looking) (?:at|through|around)\b'
      - '\b(?:use|using|with|through|open|start) (?:the |my )?(?:glasses |glasses'' )?camera\b'
      - '\bwhat (?:am i|do i have|i am) (?:holding|wearing|seeing)\b'
      - '\bcan you see\b'
    reject:
      - '\b(?:yesterday|last)\b'
  get_weather:
    tool: get_weather
    match:
      - '\bweather\b'
      - '\bforecast\b'
      - '\bis it (?:raining|sunny|hot|cold)\b'
    reject:
      - '\b(?:yesterday|last (?:week|year)|history|climate)\b'
    capture:
      - '\b(?:in|at|for) (?P<location>[a-z]+(?: [a-z]+)??)(?: right now| today| tonight| tomorrow| now)?$'
  search_web:
    tool: search_web
    match:
      - '^(?:please |can you |could you )*(?:search|google|look up|find out)(?: the web| the internet| online)?(?: for| about| on)? (?P<query>.{3,})$'
      - '^(?:please |can you |could you )*search (?:the web |the internet |online )?(?:for |about )?(?P<query>.{3,})$'
    reject:
      - '\b(?:your memory|my memory|history|battery|photos?|pictures?|glasses)\b'
    capture:
      - '^(?:please |can you |could you )*(?:search|google|look up|find out)(?: the web| the internet| online)?(?: for| about| on)? (?P<query>.{3,})$'
